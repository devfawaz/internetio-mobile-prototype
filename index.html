      <div class="home-indicator" aria-hidden="true"><span></span></div>

    <!-- Guest gate -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <img class="sheet-logo" src="assets/logo.svg" alt="internet.io" width="118" height="20">
      <h2 class="sheet-title" id="sheet-title">Sign up to save your answers</h2>
      <p class="sheet-text" id="sheet-text">Save answers, organise them into folders and ask unlimited follow-ups.</p>
      <div class="sheet-actions">
        <button class="btn btn-primary btn-block" data-auth="signup">Sign up</button>
        <button class="btn btn-secondary btn-block" data-auth="login">Log in</button>
      </div>
    </section>

    <!-- Avatar menu -->
    <div class="menu" id="avatar-menu" role="menu" aria-label="Account" hidden></div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="app.js"></script>
